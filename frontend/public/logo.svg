<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="markLime" x1="0.15" y1="0.15" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#e8ff9c"/>
      <stop offset="0.55" stop-color="#b6ff3c"/>
      <stop offset="1" stop-color="#6ecc00"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4657"/>
      <stop offset="1" stop-color="#1c2431"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#b6ff3c" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#b6ff3c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256 78 L392 130 V262 C392 340 336 396 256 428 C176 396 120 340 120 262 V130 Z"/>
    </clipPath>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- inner shield content clipped to the shield silhouette so the merge
       lines read as one shape with the shield -->
  <g clip-path="url(#shieldClip)">
    <!-- soft panel behind the mark -->
    <rect x="0" y="0" width="512" height="512" fill="#0f1620"/>

    <!-- merge diagram: two side branches converging into a main trunk -->
    <g fill="none" stroke="url(#markLime)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <!-- left branch -->
      <path d="M184 176 V232 C184 268 208 292 244 292"/>
      <!-- right branch -->
      <path d="M328 176 V232 C328 268 304 292 268 292"/>
      <!-- main trunk after merge point -->
      <path d="M256 292 V376"/>
    </g>

    <!-- branch heads (nodes) -->
    <g fill="url(#markLime)">
      <circle cx="184" cy="168" r="20"/>
      <circle cx="328" cy="168" r="20"/>
    </g>

    <!-- merge diamond (the settlement moment) -->
    <g transform="translate(256 292) rotate(45)">
      <rect x="-26" y="-26" width="52" height="52" rx="8" fill="url(#markLime)"/>
    </g>

    <!-- foot node -->
    <circle cx="256" cy="388" r="18" fill="url(#markLime)"/>
  </g>

  <!-- shield frame outline last so it sits on top -->
  <path d="M256 78 L392 130 V262 C392 340 336 396 256 428 C176 396 120 340 120 262 V130 Z"
        fill="none" stroke="url(#frame)" stroke-width="22" stroke-linejoin="round"/>
  <path d="M256 78 L392 130 V262 C392 340 336 396 256 428 C176 396 120 340 120 262 V130 Z"
        fill="none" stroke="#b6ff3c" stroke-opacity="0.28" stroke-width="4" stroke-linejoin="round"/>
</svg>
